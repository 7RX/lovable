name: THS Sitemap Catalog
on:
  push:
    paths:
      - '.github/workflows/ths-sitemap-catalog.yml'
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Fetch sitemaps
        run: |
          python - <<'PY'
          import json,re,xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          import requests
          O='https://www.tangiershookahshop.com'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0'})
          candidates=['/sitemap.xml','/sitemap_index.xml','/sitemap-index.xml','/robots.txt','/loja/sitemap.xml']
          out={'files':{},'urls':[]}
          urls=set()
          for p in candidates:
            try:
              r=s.get(O+p,timeout=30)
              txt=r.text
              out['files'][p]={'status':r.status_code,'content_type':r.headers.get('content-type'),'length':len(txt),'sample':txt[:20000]}
              if r.status_code==200:
                for u in re.findall(r'https?://[^<\s"\']+',txt):
                  if 'tangiershookahshop.com' in u: urls.add(u.rstrip())
            except Exception as e: out['files'][p]={'error':str(e)}
          # recursively fetch XML URLs discovered
          todo=[u for u in urls if 'sitemap' in u.lower()]
          seen=set()
          while todo and len(seen)<50:
            u=todo.pop(0)
            if u in seen: continue
            seen.add(u)
            try:
              r=s.get(u,timeout=30); txt=r.text
              for x in re.findall(r'<loc>\s*([^<]+)\s*</loc>',txt,re.I):
                x=x.strip()
                if 'tangiershookahshop.com' not in x: continue
                if 'sitemap' in x.lower() and x not in seen: todo.append(x)
                else: urls.add(x)
            except Exception: pass
          out['urls']=sorted(urls)
          with open('ths-store/sitemap-catalog.json','w',encoding='utf-8') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print('URLS',len(out['urls']),'SITEMAPS',len(seen))
          PY
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ths-store/sitemap-catalog.json
          git diff --cached --quiet || git commit -m "Capture THS sitemap catalog"
          git push
