name: THS Catalog Crawl

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'ths-store/catalog-scrape.json'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Crawl official THS catalog
        run: |
          python - <<'PY'
          import json, re, time
          from collections import deque
          from urllib.parse import urljoin, urlparse, urldefrag
          import requests
          from bs4 import BeautifulSoup

          ORIGIN='https://www.tangiershookahshop.com'
          seeds=[
            '/', '/carvoes-e-aluminios', '/essencias-', '/essencias-convencionais-50g',
            '/arguiles', '/rosh', '/vasos', '/acessorios'
          ]
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; THSCatalogMigration/1.0)'})
          q=deque(urljoin(ORIGIN,x) for x in seeds)
          seen=set(); products={}
          bad=re.compile(r'/(login|carrinho|checkout|contato|empresa|como-comprar|seguranca|envio|pagamento|trocas|garantia|minha-conta|newsletter)(/|$)',re.I)
          skip=re.compile(r'\.(?:jpg|jpeg|png|gif|webp|svg|css|js|ico|pdf|xml)(?:\?|$)',re.I)
          def clean_url(href):
            if not href: return None
            u=urljoin(ORIGIN,href)
            u,_=urldefrag(u)
            p=urlparse(u)
            if p.netloc not in ('www.tangiershookahshop.com','tangiershookahshop.com'): return None
            if skip.search(u) or bad.search(p.path): return None
            # discard noisy tracking/search sorting params, keep pagination only
            qs=''
            m=re.search(r'(?:\?|&)(?:pagina|page)=([0-9]+)',u,re.I)
            if m: qs='?page='+m.group(1)
            return ORIGIN+p.path.rstrip('/')+qs

          for _ in range(600):
            if not q: break
            url=q.popleft()
            if url in seen: continue
            seen.add(url)
            try:
              r=s.get(url,timeout=20)
              if r.status_code!=200 or 'text/html' not in r.headers.get('content-type',''): continue
              soup=BeautifulSoup(r.text,'html.parser')
            except Exception:
              continue

            # enqueue internal links
            for a in soup.find_all('a',href=True):
              u=clean_url(a.get('href'))
              if u and u not in seen and len(urlparse(u).path.split('/')) <= 6:
                q.append(u)

            h1=soup.find('h1')
            title=' '.join(h1.stripped_strings) if h1 else ''
            text=' '.join(soup.stripped_strings)
            price_m=re.search(r'R\$\s*(?:\(BRL\)\s*)?([0-9\.]+,[0-9]{2})',text,re.I)
            productish=bool(title and price_m and ('Comprar' in text or 'Produto indisponível' in text or 'Disponibilidade:' in text))
            if not productish: continue

            price=float(price_m.group(1).replace('.','').replace(',','.'))
            available=('Produto indisponível' not in text and 'Esse acabou' not in text)
            if 'Disponibilidade:' in text:
              available = available and ('Disponibilidade: Imediata' in text or 'Comprar' in text)

            brand=''
            bm=re.search(r'Marca:\s*[-–]?\s*([^|]{1,80}?)(?:\s+Disponibilidade:|\s+Referência:|\s+ReferÃ)',text,re.I)
            if bm: brand=bm.group(1).strip(' -')

            imgs=[]
            for img in soup.find_all('img'):
              for attr in ('src','data-src','data-original','data-lazy'):
                x=img.get(attr)
                if x and 'images.tcdn.com.br/img/img_prod/1486411' in x:
                  x=urljoin(ORIGIN,x)
                  if x not in imgs: imgs.append(x)

            # general description text
            desc=''
            marker=re.search(r'Descrição Geral\s+(.+?)(?:Formas de Pagamento|Avaliações|Produtos relacionados|$)',text,re.I)
            if marker: desc=marker.group(1).strip()[:1200]

            path=urlparse(url).path
            category=path.strip('/').split('/')[0] if path.strip('/') else ''
            products[path]={
              'title':title,'price':price,'available':available,'brand':brand,
              'image':imgs[0] if imgs else '','images':imgs[:8],
              'url':url,'path':path,'category_path':category,'description':desc
            }
            time.sleep(.03)

          data={'source':ORIGIN,'count':len(products),'pages_seen':len(seen),'products':sorted(products.values(),key=lambda x:x['title'].lower())}
          with open('ths-store/catalog-scrape.json','w',encoding='utf-8') as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          print('PRODUCTS',len(products),'PAGES',len(seen))
          PY
      - name: Commit catalog snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ths-store/catalog-scrape.json
          git diff --cached --quiet || git commit -m "Update THS official catalog snapshot"
          git push
